<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Share Pons</title>

<!-- ⛔ The site is not open yet and this page answers 200 on EVERY path while the gate is up.
     Without this, a crawler indexes the gate under every URL the site will later use. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f5f5f3" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;450;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />

<style>
/* ══ SHARE PONS — the gate ══════════════════════════════════════════════════════════════════════
   ⛔⛔ THIS PAGE IS NOT THE GATE. Caddy is. It serves this file for every request that arrives
   without the right cookie, and the real site for every request that has it — so nothing here is
   load-bearing for access control, and a reader of this source learns nothing that helps them in.
   ⚠ The password is never in this file. It is typed, stored as the cookie value, and checked by
   Caddy on the NEXT request. A wrong one simply lands back here.

   ⛔ Palette is copied from the app's :root and must stay in step with it. #C6F700 is a FILL and
   nothing else — 1.15:1 on this paper, so a rule or a dot painted it is invisible, while ink ON it
   is 14.61:1. @see web/src/styles.css. */
:root {
  --void: #f5f5f3;
  --surface: #ffffff;
  --ink: #131512;
  --ink-2: #3a3d38;
  --dim: #5a5e57;
  --faint: #666a63;
  --line: #e2e2dd;
  --line-lit: #d2d2cb;
  --signal: #c6f700;
  --signal-deep: #b8e600;
  --signal-ink: #5f7500;
  --on-signal: #131512;
  --bad: #c0392b;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: 32px 20px;
}

/* ⚠ One soft wash of the accent, well under the content. At 1.15:1 the green cannot carry an edge
   on this paper, but as a large diffuse FIELD it tints without ever drawing a visible line. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(680px 420px at 50% -8%, rgba(198, 247, 0, 0.30), transparent 70%),
    radial-gradient(520px 380px at 92% 108%, rgba(198, 247, 0, 0.16), transparent 70%);
}

main {
  position: relative;
  width: 100%;
  max-width: 680px;
  text-align: center;
}

/* ⛔ NO PLATE, NO RING, NO SHADOW, AND BIG. logo.png is a glass object photographed on white: a
   coloured tile behind it makes it read as a sticker stuck on the page rather than an object
   sitting on it, and below ~46px it degrades into a grey smudge. @see web/src/components/Mark.tsx */
.mark { width: 104px; height: 104px; object-fit: contain; display: block; margin: 0 auto 26px; }

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--signal-ink);
  margin: 0 0 16px;
}

/* ⚠ 30ch, not 20 — at 20 this sentence broke into four short lines and the whole page read as a
   narrow strip. `balance` then evens whatever is left. */
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.42rem, 3.2vw, 1.95rem);
  line-height: 1.26;
  letter-spacing: -0.028em;
  font-weight: 600;
  margin: 0 auto;
  max-width: 30ch;
  text-wrap: balance;
}

.chips { display: flex; justify-content: center; gap: 9px; margin: 26px 0 0; }
.chip {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--dim);
}
.chip svg { fill: currentColor; }

.rule { height: 1px; background: var(--line); margin: 34px auto 26px; max-width: 380px; }

form { display: flex; gap: 8px; justify-content: center; max-width: 380px; margin: 0 auto; }
/* ⛔ A FIELD IS NOT A PILL — 10px, not 999px. Actions are the roundest thing in this brand; an
   input at the same radius reads as a search box. @see --r-field in the app. */
input[type=password] {
  flex: 1 1 auto;
  min-width: 0;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-lit);
  border-radius: 10px;
  padding: 11px 14px;
}
input[type=password]::placeholder { color: var(--faint); }
input[type=password]:focus-visible {
  outline: 2px solid var(--signal-ink);
  outline-offset: 1px;
  border-color: var(--signal-ink);
}

button {
  flex: none;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  color: var(--on-signal);
  background: var(--signal);
  border: 1px solid var(--signal-deep);
  border-radius: 999px;
  padding: 11px 20px;
  transition: background 140ms ease, transform 140ms ease;
}
button:hover { background: var(--signal-deep); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ⚠ Hidden with the `hidden` attribute, not a class, so it is invisible to assistive tech too. */
.err {
  color: var(--bad);
  font-size: 0.9rem;
  margin: 14px 0 0;
}
.err[hidden] { display: none; }

.foot {
  margin: 30px 0 0;
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--faint);
}

@media (max-width: 460px) {
  form { flex-direction: column; }
  button { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
}
</style>
</head>
<body>
<main>
  <img class="mark" src="/logo.png" alt="Share Pons" />

  <p class="eyebrow">Share Pons</p>

  <h1>Launch a token and share the token fees to an X account, GitHub user, Instagram or TikTok handle.</h1>

  <div class="chips" aria-hidden="true">
          <span class="chip" title="X"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18.9 2H22l-7.1 8.1L23.2 22h-6.5l-5.1-6.6L5.8 22H2.6l7.6-8.7L1.6 2h6.7l4.6 6.1L18.9 2Zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20Z"/></svg></span>
          <span class="chip" title="GitHub"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.55v-2.1c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.25 5.69.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.8.55A11.5 11.5 0 0 0 12 .5Z"/></svg></span>
          <span class="chip" title="Instagram"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.8 3.8 0 0 1-1.38-.9 3.8 3.8 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16Zm0 1.98c-3.15 0-3.5.01-4.74.07-1.14.05-1.76.24-2.17.4-.55.21-.94.47-1.35.88-.41.41-.67.8-.88 1.35-.16.41-.35 1.03-.4 2.17-.06 1.24-.07 1.59-.07 4.74s.01 3.5.07 4.74c.05 1.14.24 1.76.4 2.17.21.55.47.94.88 1.35.41.41.8.67 1.35.88.41.16 1.03.35 2.17.4 1.24.06 1.59.07 4.74.07s3.5-.01 4.74-.07c1.14-.05 1.76-.24 2.17-.4.55-.21.94-.47 1.35-.88.41-.41.67-.8.88-1.35.16-.41.35-1.03.4-2.17.06-1.24.07-1.59.07-4.74s-.01-3.5-.07-4.74c-.05-1.14-.24-1.76-.4-2.17a3.6 3.6 0 0 0-.88-1.35 3.6 3.6 0 0 0-1.35-.88c-.41-.16-1.03-.35-2.17-.4-1.24-.06-1.59-.07-4.74-.07Zm0 3.37a4.49 4.49 0 1 1 0 8.98 4.49 4.49 0 0 1 0-8.98Zm0 7.4a2.91 2.91 0 1 0 0-5.82 2.91 2.91 0 0 0 0 5.82Zm5.72-7.6a1.05 1.05 0 1 1-2.1 0 1.05 1.05 0 0 1 2.1 0Z"/></svg></span>
          <span class="chip" title="TikTok"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5 2.59 2.59 0 0 1 0-5.18c.27 0 .53.04.77.12v-3.2a5.8 5.8 0 0 0-.77-.05A5.72 5.72 0 0 0 4.15 15.3 5.72 5.72 0 0 0 9.86 21a5.72 5.72 0 0 0 5.71-5.71V9.01a7.35 7.35 0 0 0 4.28 1.37V7.3a4.28 4.28 0 0 1-3.25-1.48Z"/></svg></span>
  </div>

  <div class="rule"></div>

  <form id="gate" autocomplete="off">
    <input
      id="pw"
      type="password"
      name="access"
      placeholder="Access code"
      aria-label="Access code"
      autocomplete="current-password"
      required
    />
    <button type="submit">Enter</button>
  </form>

  <p class="err" id="err" role="alert" hidden>That code was not accepted. Try again.</p>

  <p class="foot">Private preview</p>
</main>

<script>
/* ⛔⛔ THE PASSWORD IS NEVER CHECKED HERE, AND MUST NEVER BE. It is stored as the cookie value and
   Caddy compares it on the NEXT request; a wrong one simply serves this page again. Comparing it in
   this script would put the real secret in a file we hand to every anonymous visitor.

   ⚠ THE ERROR MESSAGE IS THEREFORE INFERRED, NOT RETURNED. We mark "a code was just submitted" in
   sessionStorage; if this page loads and that mark is set, the reload did not get through, so the
   code was wrong. Without the mark a first-time visitor would be greeted by an error. */
(function () {
  var KEY = 'sharepons.gate.tried'
  var form = document.getElementById('gate')
  var pw = document.getElementById('pw')
  var err = document.getElementById('err')

  try {
    if (sessionStorage.getItem(KEY)) {
      err.hidden = false
      sessionStorage.removeItem(KEY)
    }
  } catch (e) {
    /* private mode, or storage blocked — the gate still works, it just cannot explain itself */
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault()
    var v = pw.value.trim()
    if (!v) return

    try { sessionStorage.setItem(KEY, '1') } catch (e2) {}

    /* ⚠ 30 days, path=/ so it covers /api and /logos too, and SameSite=Lax so a link from X or a
       chat app arrives WITH the cookie. Strict would drop it on exactly those first visits and the
       gate would look broken to anyone following a shared link. */
    document.cookie =
      'sharegate=' + encodeURIComponent(v) +
      '; path=/; max-age=2592000; samesite=lax' +
      (location.protocol === 'https:' ? '; secure' : '')

    location.replace(location.pathname + location.search)
  })

  pw.focus()
})()
</script>
</body>
</html>
