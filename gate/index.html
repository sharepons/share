<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Share Pons</title>

<!-- ⛔ The site is not open yet and this page answers 200 on EVERY path while the gate is up.
     Without this, a crawler indexes the gate under every URL the site will later use. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f5f5f3" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;450;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />

<style>
/* ══ SHARE PONS — the gate ══════════════════════════════════════════════════════════════════════
   ⛔⛔ THIS PAGE IS NOT THE GATE. Caddy is. It serves this file for every request that arrives
   without the right cookie, and the real site for every request that has it — so nothing here is
   load-bearing for access control, and a reader of this source learns nothing that helps them in.
   ⚠ The access code is never in this file. It is typed, stored as the cookie value, and checked by
   Caddy on the NEXT request. A wrong one simply lands back here.

   ⭐⭐ THIS IS THE HOME PAGE HERO, REBUILT STANDALONE. Every number below is COPIED from
   `web/src/styles.css` — .hero__mark, h1, .hl, .hero__lede, .btn — so the gate is the first screen
   of the real site with the nav and the demo split removed, not a lookalike. ⛔ If you change the
   hero there, change it here: this file cannot import that stylesheet, and the two silently drift.

   ⛔ #C6F700 IS A FILL. 1.15:1 on this paper — a rule or a dot painted it is invisible. The ONE
   place it works as a mark is the thick band under the headline, because the eye reads it against
   the black letterforms rather than against the ground. Thin that band and it goes pale. */
:root {
  --void: #f5f5f3;
  --surface: #ffffff;
  --ink: #131512;
  --ink-2: #3a3d38;
  --dim: #5a5e57;
  --faint: #666a63;
  --line: #e2e2dd;
  --line-lit: #d2d2cb;
  --signal: #c6f700;
  --signal-deep: #b8e600;
  --on-signal: #131512;
  --bad: #c0392b;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
/* ⚠ 15px, matching the app's body — NOT the browser default 16. The gate was built at 16 and every
   word on it ran a step larger than the same words on the home page. */
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: 40px 20px;
}

/* ⚠ Far fainter than it was. The home page ground is flat paper; this is only here because the gate
   has no header, no nav and no content below the fold, and dead flat it read as an error page. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(760px 420px at 50% -10%, rgba(198, 247, 0, 0.11), transparent 72%);
}

main {
  position: relative;
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* ⛔ NO PLATE, NO RING, NO SHADOW. logo.png is a glass object photographed on white; a coloured
   tile behind it makes it read as a sticker on the page instead of an object on it.
   ⚠ Tight margin on purpose — the mark and the line under it are ONE unit. @see .hero__mark */
.mark {
  width: clamp(118px, 14vw, 168px);
  height: clamp(118px, 14vw, 168px);
  margin-bottom: clamp(12px, 1.6vw, 20px);
}
.mark img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: saturate(1.15) contrast(1.04);
}

h1 {
  font-family: var(--font-display);
  font-size: clamp(2.3rem, 4.6vw, 3.7rem);
  line-height: 1.02;
  letter-spacing: -0.032em;
  font-weight: 700;
  /* ⛔ margin-inline auto IS LOAD-BEARING. text-align centres the LINES inside the box, not the box
     itself, and this box is narrower than its parent. */
  margin: 0 auto 20px;
  max-width: 15ch;
  text-wrap: balance;
}

/* ⭐ THE ONE PLACE --signal IS USED AS A MARK. It survives at 1.15:1 only because it is a THICK
   band sitting directly under heavy black type, read against the letterforms like a highlighter.
   ⚠ 100%, so it clears the descenders rather than cutting a `y` in half. */
.hl {
  background-image: linear-gradient(var(--signal), var(--signal));
  background-repeat: no-repeat;
  background-size: 100% 0.14em;
  background-position: 0 100%;
  padding: 0 0.04em;
}

/* ⚠ The sentence is SUB-COPY here, the size it is on the home page — not a headline. */
.lede {
  font-size: clamp(1rem, 1.5vw, 1.14rem);
  color: var(--ink-2);
  max-width: 58ch;
  margin: 0 auto 28px;
  text-wrap: pretty;
}

.chips { display: flex; justify-content: center; gap: 9px; margin: 0 0 30px; }
.chip {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--dim);
}
.chip svg { fill: currentColor; }

/* ⛔ THE LOOK OF THE PRIMARY BUTTON, NONE OF ITS BEHAVIOUR. Same fill, same border, same radius
   and the same padding as .btn--primary.btn--lg — so it sits in the composition exactly where the
   action used to — but it is not focusable, not clickable and has no hover state, because none of
   those would lead anywhere. @see .btn--primary in web/src/styles.css */
.soon {
  margin: 0;
  display: inline-block;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 1rem;
  color: var(--on-signal);
  background: var(--signal);
  border: 1px solid var(--signal-deep);
  border-radius: 999px;
  padding: 13px 22px;
  /* ⚠ It is text, not a control: no pointer, and nothing to select mid-sentence. */
  cursor: default;
  user-select: none;
}

@media (prefers-reduced-motion: reduce) {
  .chip { transition: none; }
}
</style>
</head>
<body>
<main>
  <div class="mark">
    <!-- ⚠ Decorative: the headline under it already names the product, so alt text here would make
         a screen reader announce it twice. @see components/Hero.tsx -->
    <img src="/logo.png" alt="" />
  </div>

  <h1><span class="hl">Share the fees</span></h1>

  <p class="lede">Launch a token and share the token fees to an X account, GitHub user, Instagram or TikTok handle.</p>

  <div class="chips" aria-hidden="true">

      <span class="chip" title="TikTok"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5 2.59 2.59 0 0 1 0-5.18c.27 0 .53.04.77.12v-3.2a5.8 5.8 0 0 0-.77-.05A5.72 5.72 0 0 0 4.15 15.3 5.72 5.72 0 0 0 9.86 21a5.72 5.72 0 0 0 5.71-5.71V9.01a7.35 7.35 0 0 0 4.28 1.37V7.3a4.28 4.28 0 0 1-3.25-1.48Z"/></svg></span>
  </div>

  <!-- ⛔⛔ A <p>, NOT A <button>. It is a status, and there is nothing to press. A real button that
       does nothing is worse than no button: it takes focus, it invites a click, and a keyboard or
       screen-reader user is told there is an action here when there is not. It borrows the button's
       look on purpose and none of its behaviour. -->
  <p class="soon">Launching soon</p>
</main>

<script>
/* ⛔⛔ THERE IS NO LONGER A WAY IN FROM THIS PAGE, BY DESIGN — the form is gone and the pill is a
   status, not a control. Which would lock the OPERATOR out too, so one invisible door remains:

       https://sharepons.family/?key=THE_ACCESS_CODE

   It writes the cookie Caddy checks and immediately replaces the URL with the bare path, so the
   code does not linger in the address bar, in history, or in a Referer header on the next click.

   ⚠ The code still travels in a URL, which a basic_auth password did not. Treat that link as the
   credential it is: do not post it, and do not put it anywhere that logs full URLs.
   ⛔ Nothing here validates it. Caddy compares the cookie on the NEXT request; a wrong key simply
   lands back on this page, which is why there is no error state left to show. */
(function () {
  var m = /[?&]key=([^&]+)/.exec(location.search)
  if (!m) return

  document.cookie =
    'sharegate=' + m[1] +
    '; path=/; max-age=2592000; samesite=lax' +
    (location.protocol === 'https:' ? '; secure' : '')

  /* ⚠ replace(), not assign() — the URL carrying the code must not become a history entry. */
  location.replace(location.pathname)
})()
</script>
</body>
</html>
